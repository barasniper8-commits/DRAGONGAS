name: ThyoCloud Personal RDP (Cyberpunk)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
        type: string

      customUsername:
        description: 'Username RDP (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'
        type: string

jobs:
  build-rdp:
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke ThyoCloud Server Web
        shell: pwsh
        env:
          EMAIL: ${{ inputs.userEmail }}
          USER: ${{ inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ inputs.osChoice }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       THYOCLOUD PERSONAL RDP"
          Write-Host "=============================================="
          Write-Host "[01/04] Memeriksa konfigurasi..."
          Write-Host "OS: $env:OS_TYPE"
          Write-Host "Username: $env:USER"
          Write-Host "[02/04] Menghubungkan ke ThyoCloud API..."

          $webUrl = "https://thyo.cloud/api/get-core"

          $body = @{
            email    = $env:EMAIL
            username = $env:USER
            repo     = $env:REPO
          } | ConvertTo-Json

          try {
            $req = Invoke-RestMethod `
              -Uri $webUrl `
              -Method Post `
              -Body $body `
              -ContentType "application/json" `
              -TimeoutSec 60

            if ($req.success -ne $true) {
              Write-Host "[ERROR] Verifikasi ThyoCloud gagal."
              Write-Host $req.message
              exit 1
            }

            if ([string]::IsNullOrWhiteSpace([string]$req.script)) {
              throw "Script Core Engine tidak tersedia."
            }

            Write-Host "[03/04] Akses diterima."
            Write-Host "[04/04] Menjalankan Core Engine..."

            Invoke-Expression ([string]$req.script)
          }
          catch {
            Write-Host "[ERROR] Proses ThyoCloud gagal."
            Write-Host $_.Exception.Message
            exit 1
          }

      - name: 🎨 Download Wallpaper Arianto
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       ARIANTO WALLPAPER INSTALLER"
          Write-Host "=============================================="

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $wallpaperPath = Join-Path $env:RUNNER_TEMP "arianto-wallpaper.jpg"

          Write-Host "[01/03] Mengunduh gambar wallpaper..."

          Invoke-WebRequest `
            -Uri $wallpaperUrl `
            -OutFile $wallpaperPath `
            -TimeoutSec 60

          if (-not (Test-Path $wallpaperPath)) {
            throw "Wallpaper tidak ditemukan."
          }

          if ((Get-Item $wallpaperPath).Length -lt 1024) {
            throw "File wallpaper kosong atau tidak valid."
          }

          Write-Host "[02/03] Wallpaper berhasil diunduh."
          Write-Host "Lokasi file: $wallpaperPath"

          # Runner GitHub Actions dan sesi RDP dapat menggunakan
          # akun Windows yang berbeda. Karena itu, simpan aset
          # terlebih dahulu; penerapan harus dilakukan di sesi RDP.

      - name: 🖥️ Terapkan Wallpaper ke Sesi Windows
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       WINDOWS DESKTOP CONFIGURATION"
          Write-Host "=============================================="

          # File di RUNNER_TEMP tidak otomatis tersedia sebagai
          # wallpaper untuk akun RDP yang berbeda.
          # Unduh langsung ke profil akun yang menjalankan langkah ini.

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $desktopDir = Join-Path $env:USERPROFILE "Pictures"
          New-Item -ItemType Directory -Path $desktopDir -Force |
            Out-Null

          $wallpaperPath = Join-Path $desktopDir "Arianto-Wallpaper.jpg"

          Write-Host "[01/04] Mengunduh wallpaper..."
          Invoke-WebRequest `
            -Uri $wallpaperUrl `
            -OutFile $wallpaperPath `
            -TimeoutSec 60

          if (-not (Test-Path $wallpaperPath)) {
            throw "Gagal mengunduh wallpaper."
          }

          Write-Host "[02/04] Menyiapkan pengaturan desktop..."

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name WallpaperStyle `
            -Value "10"

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name TileWallpaper `
            -Value "0"

          if (-not ("AriantoWallpaperApi" -as [type])) {
            Add-Type @"
          using System.Runtime.InteropServices;

          public class AriantoWallpaperApi {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool SystemParametersInfo(
                  int action,
                  int param,
                  string path,
                  int flags
              );
          }
          "@
          }

          Write-Host "[03/04] Menerapkan wallpaper Windows..."

          $result = [AriantoWallpaperApi]::SystemParametersInfo(
            20,
            0,
            $wallpaperPath,
            3
          )

          if (-not $result) {
            throw "Windows gagal menerapkan wallpaper."
          }

          Write-Host "[04/04] Wallpaper berhasil diterapkan."
          Write-Host "File: $wallpaperPath"
