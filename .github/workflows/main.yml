name: Cloud RDP tanpa VPN

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) { 
            $pass = "Dr4g0n#99`$Xau"
            Write-Host "Menggunakan default password yang kuat: Dr4g0n#99`$Xau" -ForegroundColor Yellow
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Mengunduh Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Autentikasi Token Ngrok
      run: |
        $token = "${{ secrets.NGROK_AUTH_TOKEN }}"
        if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Host "ERROR: NGROK_AUTH_TOKEN belum diisi di GitHub Secrets!" -ForegroundColor Red
            exit 1
        }
        .\ngrok.exe config add-authtoken $token

    - name: Membuka Jalur TCP Tunnel (Port 3389)
      run: |
        Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -WindowStyle Hidden
        Start-Sleep -Seconds 5

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        $tunnels = (Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing).Content | ConvertFrom-Json
        $tcpTunnel = $tunnels.tunnels | Where-Object { $_.proto -eq "tcp" }
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat!" -ForegroundColor Green
        Write-Host " Alamat Host & Port : $($tcpTunnel.public_url -replace 'tcp://', '')"
        Write-Host " Username           : runneradmin"
        Write-Host " Password           : (Secret RDP_PASS atau Dr4g0n#99`$Xau)"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
