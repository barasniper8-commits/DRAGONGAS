name: Cloud RDP (Localtonet)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) {$pass = "Dr4g0n#99`$Xau"
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Download & Otentikasi Localtonet
      run: |
        # Download binary resmi Windows 64-bit
        Invoke-WebRequest -Uri "https://localtonet.com/download/localtonet-win-x64.zip" -OutFile "localtonet.zip"
        Expand-Archive -Path "localtonet.zip" -DestinationPath "." -Force

        # Otentikasi Token Localtonet
        .\localtonet.exe --authtoken Xy69Aj4vYi7qgoHtNfLbZD52aw1lxp0zT
        Start-Sleep -Seconds 5

    - name: Membuka Tunnel RDP (Port 3389)
      run: |
        # Menjalankan tunnel di latar belakang
        Start-Process -FilePath ".\localtonet.exe" -ArgumentList "tcp --port 3389" -PassThru
        Start-Sleep -Seconds 10

    - name: Detail Login RDP
      run: |
        Write-Host "=================================================="
        Write-Host " RDP LOCALTONET AKTIFF!" -ForegroundColor Green
        Write-Host "=================================================="
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host "--------------------------------------------------"
        Write-Host " Cek Host & Port RDP di Dashboard Localtonet Anda!"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
