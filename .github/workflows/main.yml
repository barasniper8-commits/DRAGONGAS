name: Cloud RDP (Cloudflare Tunnel)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) { 
            $pass = "Dr4g0n#99`$Xau"
            Write-Host "Menggunakan default password: Dr4g0n#99`$Xau" -ForegroundColor Yellow
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Install Cloudflare Tunnel
      run: |
        winget install --id Cloudflare.cloudflared -e --silent

    - name: Membuka Jalur TCP Tunnel dengan Cloudflare
      run: |
        Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardOutput "cf_out.log" -RedirectStandardError "cf_err.log" -PassThru
        Start-Sleep -Seconds 15

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat via Cloudflare!" -ForegroundColor Green
        Write-Host "=================================================="
        Get-Content cf_out.log -ErrorAction SilentlyContinue
        Get-Content cf_err.log -ErrorAction SilentlyContinue
        Write-Host "--------------------------------------------------"
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
