name: ThyoCloud Personal RDP (Cyberpunk)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
        type: string

      customUsername:
        description: 'Username RDP (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'
        type: string

jobs:
  build-rdp:
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke ThyoCloud Server Web
        shell: pwsh
        env:
          EMAIL: ${{ inputs.userEmail }}
          RDP_USERNAME: ${{ inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ inputs.osChoice }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       THYOCLOUD PERSONAL RDP"
          Write-Host "=============================================="
          Write-Host "[01/04] Memeriksa konfigurasi..."
          Write-Host "OS: $env:OS_TYPE"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "[02/04] Menghubungkan ke ThyoCloud API..."

          $webUrl = "https://thyo.cloud/api/get-core"

          $body = @{
            email    = $env:EMAIL
            username = $env:RDP_USERNAME
            repo     = $env:REPO
          } | ConvertTo-Json

          try {
            $req = Invoke-RestMethod `
              -Uri $webUrl `
              -Method Post `
              -Body $body `
              -ContentType "application/json" `
              -TimeoutSec 60

            if ($req.success -ne $true) {
              throw "Verifikasi ThyoCloud gagal: $($req.message)"
            }

            if ([string]::IsNullOrWhiteSpace([string]$req.script)) {
              throw "Core Engine tidak tersedia dari API."
            }

            Write-Host "[03/04] Akses diterima."
            Write-Host "[04/04] Menjalankan Core Engine..."

            Invoke-Expression ([string]$req.script)

            Write-Host "Core Engine selesai dijalankan."
          }
          catch {
            Write-Host "[ERROR] Proses ThyoCloud gagal."
            Write-Host $_.Exception.Message
            exit 1
          }

      - name: 🎨 Download dan Validasi Wallpaper Arianto
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $wallpaperPath = Join-Path $env:RUNNER_TEMP "arianto-wallpaper.jpg"

          Write-Host "=============================================="
          Write-Host "       ARIANTO WALLPAPER DOWNLOADER"
          Write-Host "=============================================="

          try {
            Write-Host "[01/04] Mengunduh wallpaper..."

            Invoke-WebRequest `
              -Uri $wallpaperUrl `
              -Method Get `
              -Headers @{ "User-Agent" = "Mozilla/5.0" } `
              -OutFile $wallpaperPath `
              -TimeoutSec 60

            if (-not (Test-Path $wallpaperPath)) {
              throw "File wallpaper tidak ditemukan."
            }

            $file = Get-Item $wallpaperPath

            if ($file.Length -lt 1024) {
              throw "File terlalu kecil atau tidak valid."
            }

            Write-Host "[02/04] Memeriksa format gambar..."

            $stream = [System.IO.File]::OpenRead($wallpaperPath)

            try {
              $header = New-Object byte[] 8
              $read = $stream.Read($header, 0, 8)
            }
            finally {
              $stream.Dispose()
            }

            $isJpeg = (
              $read -ge 3 -and
              $header[0] -eq 255 -and
              $header[1] -eq 216 -and
              $header[2] -eq 255
            )

            $isPng = (
              $read -ge 8 -and
              $header[0] -eq 137 -and
              $header[1] -eq 80 -and
              $header[2] -eq 78 -and
              $header[3] -eq 71
            )

            if (-not ($isJpeg -or $isPng)) {
              throw "Server tidak mengembalikan file JPG atau PNG."
            }

            Write-Host "[03/04] Wallpaper valid."
            Write-Host "Ukuran: $($file.Length) bytes"
            Write-Host "Lokasi: $wallpaperPath"
            Write-Host "[04/04] Download selesai."

            # File ini berada di runner GitHub.
            # File belum otomatis berada di server RDP.
          }
          catch {
            Write-Host "[ERROR] Download wallpaper gagal."
            Write-Host $_.Exception.Message
            exit 1
          }

      - name: 🖥️ Status Integrasi Wallpaper RDP
        if: success()
        shell: pwsh
        run: |
          Write-Host "=============================================="
          Write-Host "       STATUS WALLPAPER RDP"
          Write-Host "=============================================="
          Write-Host "Wallpaper berhasil diunduh ke runner."
          Write-Host "Penerapan pada desktop RDP belum dikonfirmasi."
          Write-Host ""
          Write-Host "Agar wallpaper berubah di server ThyoCloud,"
          Write-Host "Core Engine perlu menerapkan gambar tersebut"
          Write-Host "pada profil akun Windows RDP yang sebenarnya."
