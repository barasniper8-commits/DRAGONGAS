          # --- TAMBAHAN KODE UNTUK GANTI WALLPAPER ---
          Write-Host "Mengubah wallpaper desktop..."
          $imageUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh_ezWnmgsHEVv4JafO82YQBBEakIVYSy36FbHO9YlyMlWNO8y4diMoBsWdI-pynrHq_oPGgKzT9Zh2O5Xfg02yfrFKCMPJyEC2DwZs6CkdfKywWmCmWfr9tWWemg7UKoiYxF1oXdKfie0mUzpg0UBZo1CfeILeBVcj47JYU42IiNTrBHjLGbsTbN_rnxA/s1600/1000186451.jpg" # Ganti dengan URL gambar langsung (format .jpg / .png)
          $outputFile = "$env:TEMP\custom_wallpaper.jpg"
          
          try {
              # Download gambar ke folder Temp
              Invoke-WebRequest -Uri $imageUrl -OutFile $outputFile
              
              # Panggil fungsi Windows API untuk mengubah wallpaper
              Add-Type -TypeDefinition @"
              using System.Runtime.InteropServices;
              public class WallpaperSetter {
                  [DllImport("user32.dll", CharSet = CharSet.Auto)]
                  public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
              }
"@
              [WallpaperSetter]::SystemParametersInfo(20, 0, $outputFile, 3)
              Write-Host "✅ Wallpaper berhasil diubah!"
          } catch {
              Write-Host "⚠️ Gagal mengubah wallpaper: $_"
          }
