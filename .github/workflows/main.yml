name: Cloud RDP (Localtonet)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) {$pass = "Dr4g0n#99`$Xau"
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Download & Jalankan Localtonet
      run: |
        Invoke-WebRequest -Uri "https://localtonet.com/download/localtonet-windows-x64.zip" -OutFile "localtonet.zip"
        Expand-Archive localtonet.zip -DestinationPath .
        # Tempelkan Auth Token Anda di bawah ini
        Start-Process -FilePath ".\localtonet.exe" -ArgumentList "authtoken PASTE_TOKEN_LOCALTONET_DI_SINI" -PassThru
        Start-Sleep -Seconds 10

    - name: Detail Login
      run: |
        Write-Host "=================================================="
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host " Cek Host & Port RDP di Dashboard Localtonet!"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
