name: Windows RDP Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Masukkan Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "RDP berhasil diaktifkan!"

    - name: Mengatur Password Administrator
      run: |
        net user runneradmin RDPPassword123!
        Write-Host "Password user runneradmin berhasil diset!"

    - name: Install Tailscale
      run: |
        winget install Tailscale.Tailscale --accept-source-agreements --accept-package-agreements
        Write-Host "Tailscale berhasil diinstal!"

    - name: Menghubungkan ke Tailscale Network
      env:
        TS_AUTHKEY: ${{ github.event.inputs.tailscale_authkey }}
      run: |
        Start-Sleep -s 10
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --unauthenticated=false --accept-routes
        Start-Sleep -s 5
        Write-Host "--- IP TAILSCALE ANDA ---"
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4
