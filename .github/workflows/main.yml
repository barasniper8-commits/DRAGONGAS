name: Cloud RDP tanpa VPN

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        echo "runneradmin`n$pass`n$pass" | net user runneradmin /add /active:yes
        net localgroup administrators runneradmin /add

    - name: Mengunduh Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Autentikasi Token Ngrok
      run: |
        .\ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Membuka Jalur TCP Tunnel (Port 3389)
      run: |
        Start-Process .\ngrok.exe -ArgumentList "tcp 3389" -WindowStyle Hidden

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 7
        $tunnels = (Invoke-WebRequest -Uri "http://localhost:4040/api/tunnels" -UseBasicParsing).Content | ConvertFrom-Json
        $tcpTunnel = $tunnels.tunnels \vert{} Where-Object {$_.proto -eq "tcp" }
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat!" -ForegroundColor Green
        Write-Host " Alamat Host & Port : $($tcpTunnel.public_url -replace 'tcp://', '')"
        Write-Host " Username           : runneradmin"
        Write-Host " Password           : (Sesuai secret RDP_PASS Anda)"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350 # Durasi aktif dalam menit (Maksimal ~6 jam)
        Start-Sleep -Seconds ($duration * 60)
