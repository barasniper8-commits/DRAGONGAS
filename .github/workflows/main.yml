name: ThyoCloud Personal RDP (Cyberpunk)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
        type: string

      customUsername:
        description: 'Username RDP (Opsional - Default: thyocloud)'
        required: false
        default: 'thyocloud'
        type: string

jobs:
  build-rdp:
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke ThyoCloud Server Web
        shell: pwsh
        env:
          EMAIL: ${{ inputs.userEmail }}
          RDP_USERNAME: ${{ inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ inputs.osChoice }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       THYOCLOUD PERSONAL RDP"
          Write-Host "=============================================="
          Write-Host "[01/04] Memeriksa konfigurasi..."
          Write-Host "OS: $env:OS_TYPE"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "[02/04] Menghubungkan ke ThyoCloud API..."

          $webUrl = "https://thyo.cloud/api/get-core"

          $body = @{
            email    = $env:EMAIL
            username = $env:RDP_USERNAME
            repo     = $env:REPO
          } | ConvertTo-Json

          try {
            $req = Invoke-RestMethod `
              -Uri $webUrl `
              -Method Post `
              -Body $body `
              -ContentType "application/json" `
              -TimeoutSec 60

            if ($req.success -ne $true) {
              throw "Verifikasi ThyoCloud gagal: $($req.message)"
            }

            if ([string]::IsNullOrWhiteSpace([string]$req.script)) {
              throw "Core Engine tidak tersedia dari API."
            }

            Write-Host "[03/04] Akses diterima."
            Write-Host "[04/04] Menjalankan Core Engine..."

            # Core Engine tetap dipanggil sesuai mekanisme asli.
            Invoke-Expression ([string]$req.script)

            Write-Host "Core Engine selesai dijalankan."
          }
          catch {
            Write-Host "[ERROR] $($_.Exception.Message)"
            exit 1
          }

      - name: 🎨 Download Wallpaper Arianto
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $wallpaperPath = Join-Path $env:RUNNER_TEMP "arianto-wallpaper.jpg"

          Write-Host "=============================================="
          Write-Host "       ARIANTO WALLPAPER INSTALLER"
          Write-Host "=============================================="
          Write-Host "[01/03] Mengunduh wallpaper..."

          Invoke-WebRequest `
            -Uri $wallpaperUrl `
            -OutFile $wallpaperPath `
            -TimeoutSec 60

          if (-not (Test-Path $wallpaperPath)) {
            throw "Wallpaper tidak ditemukan."
          }

          if ((Get-Item $wallpaperPath).Length -lt 1024) {
            throw "File wallpaper tidak valid."
          }

          Write-Host "[02/03] Wallpaper berhasil diunduh."
          Write-Host "Lokasi: $wallpaperPath"
          Write-Host "[03/03] Aset siap digunakan."

          # File ini berada pada runner GitHub.
          # File tidak otomatis berada di server Core Engine.

      - name: 🖥️ Terapkan Wallpaper Akun Windows
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       WINDOWS WALLPAPER CONFIGURATION"
          Write-Host "=============================================="

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhzLeo5tAdHA-WjC1GTIVPdb3PGFhDVyL8Ebvmu5scScHRI58C1WfxoxjXdLVgD6KodOiPkakz1HfmCcopdW0vmE158IP4HoykzwI8JnsdzT6aIMvBrHbm-XuhzTmawbyWreEDTupVbwNXqVfEgBFPoqP4ROGzVGHCZdQLd7yJCGXJe_dVKbwGQTAxWOng/s1600/1000186452.jpg"

          $folder = Join-Path $env:LOCALAPPDATA "AriantoRDP"
          New-Item -ItemType Directory -Path $folder -Force |
            Out-Null

          $file = Join-Path $folder "wallpaper.jpg"

          Write-Host "[01/04] Mengunduh wallpaper..."
          Invoke-WebRequest `
            -Uri $wallpaperUrl `
            -OutFile $file `
            -TimeoutSec 60

          if ((Get-Item $file).Length -lt 1024) {
            throw "File wallpaper tidak valid."
          }

          Write-Host "[02/04] Mengatur wallpaper Windows..."
          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name WallpaperStyle `
            -Value "10"

          Set-ItemProperty `
            -Path "HKCU:\Control Panel\Desktop" `
            -Name TileWallpaper `
            -Value "0"

          if (-not ("AriantoWallpaperAPI" -as [type])) {
            Add-Type @"
          using System.Runtime.InteropServices;

          public class AriantoWallpaperAPI {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool SystemParametersInfo(
                  int action,
                  int param,
                  string path,
                  int flags
              );
          }
          "@
          }

          Write-Host "[03/04] Menerapkan wallpaper..."
          $result = [AriantoWallpaperAPI]::SystemParametersInfo(
            20, 0, $file, 3
          )

          if (-not $result) {
            throw "Windows gagal menerapkan wallpaper."
          }

          Write-Host "[04/04] Wallpaper diterapkan ke akun runner."
          Write-Host "File: $file"
          Write-Host "Perubahan pada akun RDP memerlukan eksekusi"
          Write-Host "di sesi Windows yang dibuat oleh Core Engine."
