
# ==========================================
# ARIANTO RDP - CYBERPUNK NEON THEME
# Wallpaper Desktop + Account Picture
# ==========================================

$ErrorActionPreference = "Stop"

$ThemeDir = Join-Path $env:LOCALAPPDATA "AriantoCyberpunk"
$WallpaperPath = Join-Path $ThemeDir "wallpaper.jpg"
$ProfilePicturePath = Join-Path $ThemeDir "profile.jpg"

New-Item -Path $ThemeDir -ItemType Directory -Force | Out-Null

# Ganti dengan URL gambar milikmu.
$WallpaperURL = "https://example.com/cyberpunk-wallpaper.jpg"
$ProfileURL   = "https://example.com/cyberpunk-profile.jpg"

Write-Host "[01/04] MENYIAPKAN DIREKTORI..." -ForegroundColor Cyan

# Unduh wallpaper
Write-Host "[02/04] MENGUNDUH WALLPAPER..." -ForegroundColor Magenta

Invoke-WebRequest `
    -Uri $WallpaperURL `
    -OutFile $WallpaperPath `
    -UseBasicParsing

if (!(Test-Path $WallpaperPath)) {
    throw "Wallpaper tidak ditemukan."
}

# Atur wallpaper untuk akun Windows saat ini
Write-Host "[03/04] MENERAPKAN WALLPAPER..." -ForegroundColor Cyan

Add-Type @"
using System.Runtime.InteropServices;
public class DesktopWallpaper {
    [DllImport("user32.dll", SetLastError = true,
    CharSet = CharSet.Auto)]
    public static extern int SystemParametersInfo(
        int action, int param, string path, int flags);
}
"@

# SPI_SETDESKWALLPAPER = 20
# SPIF_UPDATEINIFILE | SPIF_SENDCHANGE = 3
$result = [DesktopWallpaper]::SystemParametersInfo(
    20, 0, $WallpaperPath, 3
)

if ($result -eq 0) {
    throw "Gagal menerapkan wallpaper."
}

# Simpan pengaturan wallpaper
Set-ItemProperty `
    -Path "HKCU:\Control Panel\Desktop" `
    -Name Wallpaper `
    -Value $WallpaperPath

Set-ItemProperty `
    -Path "HKCU:\Control Panel\Desktop" `
    -Name WallpaperStyle `
    -Value "10"

Set-ItemProperty `
    -Path "HKCU:\Control Panel\Desktop" `
    -Name TileWallpaper `
    -Value "0"

Write-Host "[04/04] TEMA CYBERPUNK AKTIF!" -ForegroundColor Green
Write-Host "Wallpaper: $WallpaperPath" -ForegroundColor Cyan
Write-Host "Foto profil: $ProfilePicturePath" -ForegroundColor Cyan
