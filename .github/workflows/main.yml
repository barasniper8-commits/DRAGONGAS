name: Cloud RDP (Pinggy)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) {$pass = "Dr4g0n#99`$Xau"
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Jalankan Pinggy Tunnel
      run: |
        Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 a.pinggy.io" -RedirectStandardError "pinggy.log" -PassThru
        Start-Sleep -Seconds 12

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat via Pinggy!" -ForegroundColor Green
        Write-Host "=================================================="
        Get-Content pinggy.log -ErrorAction SilentlyContinue
        Write-Host "--------------------------------------------------"
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
