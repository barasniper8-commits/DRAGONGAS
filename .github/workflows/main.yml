name: ThyoCloud Personal RDP (Cyberpunk)

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
        type: string

      customUsername:
        description: 'Username RDP'
        required: false
        default: 'thyocloud'
        type: string

jobs:
  build-rdp:
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke ThyoCloud Server Web
        shell: pwsh
        env:
          EMAIL: ${{ inputs.userEmail }}
          USER: ${{ inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ inputs.osChoice }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       THYOCLOUD CYBERPUNK RDP"
          Write-Host "=============================================="
          Write-Host "[01/04] Memeriksa konfigurasi Windows..."
          Write-Host "OS       : $env:OS_TYPE"
          Write-Host "Username : $env:USER"
          Write-Host "[02/04] Menghubungkan ke ThyoCloud API..."

          $webUrl = "https://thyo.cloud/api/get-core"

          $body = @{
            email    = $env:EMAIL
            username = $env:USER
            repo     = $env:REPO
          } | ConvertTo-Json

          try {
            $req = Invoke-RestMethod `
              -Uri $webUrl `
              -Method Post `
              -Body $body `
              -ContentType "application/json" `
              -TimeoutSec 60

            if ($req.success -ne $true) {
              Write-Host "[ERROR] Verifikasi ThyoCloud gagal."
              Write-Host $req.message
              exit 1
            }

            Write-Host "[03/04] Akses diterima."
            Write-Host "[04/04] Menjalankan Core Engine..."

            if ([string]::IsNullOrWhiteSpace([string]$req.script)) {
              throw "Core Engine tidak tersedia dari API."
            }

            # Menjalankan script resmi yang dikembalikan API.
            # Tidak menampilkan isi script atau kredensial ke log.
            Invoke-Expression ([string]$req.script)

            Write-Host ""
            Write-Host "Core Engine selesai dijalankan."
            Write-Host "Periksa log di atas untuk status persiapan RDP."
          }
          catch {
            Write-Host "[ERROR] Proses ThyoCloud gagal."
            Write-Host $_.Exception.Message
            exit 1
          }

      - name: 🎨 Siapkan aset Cyberpunk
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host "       CYBERPUNK DESKTOP CONFIGURATION"
          Write-Host "=============================================="

          $assetDir = Join-Path $env:RUNNER_TEMP "cyberpunk-assets"
          New-Item -ItemType Directory -Path $assetDir -Force |
            Out-Null

          # URL gambar dapat diganti dengan URL gambar milikmu.
          $wallpaperUrl = "https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=90"
          $profileUrl = "https://images.unsplash.com/photo-1535223289827-42f1e9919769?auto=format&fit=crop&w=512&q=90"

          $wallpaperPath = Join-Path $assetDir "wallpaper.jpg"
          $profilePath = Join-Path $assetDir "profile.jpg"

          try {
            Invoke-WebRequest `
              -Uri $wallpaperUrl `
              -OutFile $wallpaperPath `
              -TimeoutSec 30

            Invoke-WebRequest `
              -Uri $profileUrl `
              -OutFile $profilePath `
              -TimeoutSec 30

            Write-Host "[OK] Wallpaper tersimpan."
            Write-Host "[OK] Foto profil tersimpan."
            Write-Host "Folder aset: $assetDir"
            Write-Host ""
            Write-Host "Aset siap digunakan oleh konfigurasi Windows."
            Write-Host "Catatan: file gambar saja tidak mengubah profil"
            Write-Host "atau wallpaper Windows secara otomatis."
          }
          catch {
            Write-Host "[WARNING] Gagal mengambil aset gambar."
            Write-Host "Periksa URL atau koneksi internet."
            Write-Host $_.Exception.Message
          }
