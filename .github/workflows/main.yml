name: Cloud RDP Tanpa VPN (Pinggy)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) { 
            $pass = "Dr4g0n#99`$Xau"
            Write-Host "Menggunakan default password: Dr4g0n#99`$Xau" -ForegroundColor Yellow
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Membuka Jalur TCP Tunnel dengan Pinggy
      run: |
        # Menggunakan domain resmi free.pinggy.io untuk TCP Tunnel
        Start-Process -FilePath "ssh.exe" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@free.pinggy.io" -RedirectStandardOutput "pinggy_out.log" -RedirectStandardError "pinggy_err.log" -PassThru
        Start-Sleep -Seconds 15

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat via Pinggy!" -ForegroundColor Green
        Write-Host "=================================================="
        Write-Host "--- ISI LOG PINGGY OUT ---"
        Get-Content pinggy_out.log -ErrorAction SilentlyContinue
        Write-Host "--- ISI LOG PINGGY ERR ---"
        Get-Content pinggy_err.log -ErrorAction SilentlyContinue
        Write-Host "--------------------------------------------------"
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
