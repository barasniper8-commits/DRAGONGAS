
name: Arianto RDP Cyberpunk Theme

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: "Pilih Windows Runner"
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-latest
          - windows-2025
          - windows-2022

jobs:
  cyberpunk-theme:
    name: Apply Cyberpunk Wallpaper
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 10

    steps:
      - name: Initialize Cyberpunk Theme
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host " ARIANTO RDP - CYBERPUNK NEON"
          Write-Host "======================================"

          $ThemeDir = Join-Path $env:LOCALAPPDATA "AriantoCyberpunk"

          New-Item `
            -Path $ThemeDir `
            -ItemType Directory `
            -Force | Out-Null

          Write-Host "[OK] Folder tema dibuat: $ThemeDir"

      - name: Configure Desktop Wallpaper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Gunakan URL langsung ke file JPG/PNG milikmu.
          $WallpaperURL = "https://example.com/cyberpunk-wallpaper.jpg"

          $ThemeDir = Join-Path $env:LOCALAPPDATA "AriantoCyberpunk"
          $WallpaperPath = Join-Path $ThemeDir "wallpaper.jpg"

          Write-Host "[01] Mengunduh wallpaper..."

          try {
            Invoke-WebRequest `
              -Uri $WallpaperURL `
              -OutFile $WallpaperPath `
              -TimeoutSec 30 `
              -UseBasicParsing

            if (!(Test-Path $WallpaperPath)) {
              throw "File wallpaper tidak ditemukan."
            }

            $Image = [System.Drawing.Image]::FromFile($WallpaperPath)
            $Image.Dispose()

            Add-Type @"
          using System.Runtime.InteropServices;
          public class DesktopWallpaper {
              [DllImport("user32.dll", SetLastError = true,
              CharSet = CharSet.Auto)]
              public static extern bool SystemParametersInfo(
                  int action, int param, string path, int flags);
          }
          "@

            $result = [DesktopWallpaper]::SystemParametersInfo(
              20, 0, $WallpaperPath, 3
            )

            if (!$result) {
              throw "Windows gagal menerapkan wallpaper."
            }

            Set-ItemProperty `
              -Path "HKCU:\Control Panel\Desktop" `
              -Name WallpaperStyle `
              -Value "10"

            Set-ItemProperty `
              -Path "HKCU:\Control Panel\Desktop" `
              -Name TileWallpaper `
              -Value "0"

            Write-Host "[OK] Wallpaper diterapkan."
          }
          catch {
            Write-Host "[ERROR] $($_.Exception.Message)"
            throw
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Host "======================================"
          Write-Host " CYBERPUNK THEME WORKFLOW SELESAI"
          Write-Host "======================================"
          Write-Host "Catatan: perubahan desktop berlaku"
          Write-Host "pada sesi pengguna runner ini."
