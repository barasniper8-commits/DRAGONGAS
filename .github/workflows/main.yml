name: Cloud RDP (Cloudflare TCP)

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Mengaktifkan Fitur RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Mengatur Kredensial User (runneradmin)
      run: |
        $pass = "${{ secrets.RDP_PASS }}"
        if ([string]::IsNullOrWhiteSpace($pass)) {$pass = "Dr4g0n#99`$Xau"
        }
        net user runneradmin $pass
        net localgroup administrators runneradmin /add
        exit 0

    - name: Download & Jalankan Cloudflared
      run: |
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
        Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "cf.log" -PassThru
        Start-Sleep -Seconds 10

    - name: Menampilkan Detail Koneksi RDP
      run: |
        Start-Sleep -Seconds 5
        Write-Host "=================================================="
        Write-Host " RDP Berhasil Dibuat via Cloudflare!" -ForegroundColor Green
        Write-Host "=================================================="
        Get-Content cf.log | Select-String "trycloudflare.com"
        Write-Host "--------------------------------------------------"
        Write-Host " Username : runneradmin"
        Write-Host " Password : Dr4g0n#99`$Xau"
        Write-Host "=================================================="

    - name: Menjaga Sesi RDP Tetap Aktif
      run: |
        $duration = 350
        Start-Sleep -Seconds ($duration * 60)
